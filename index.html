<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>St. Xavier's Campus Tour & Pathfinding</title>
  
  <style>
    /* Color Palette: Red (#8b0000), Dark Black (#111111), Light Neutral (#f8f9fa) */
    :root {
      --primary-red: #8b0000;
      --dark-red: #660000;
      --text-black: #111111;
      --bg-light: #f8f9fa;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      color: var(--text-black);
    }

    /* Main Container Frame */
    .app-container {
      border: 0.5px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      height: 100vh;
      max-height: 900px;
      margin: 0 auto;
      background: #ffffff;
    }

    .app {
      display: flex;
      height: 100%;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 190px;
      background: #2b2b2b;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .sidebar-btn {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #f0f0f0;
      color: #333;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }

    .sidebar-btn:hover {
      background: #e0e0e0;
    }

    .sidebar-btn.active {
      background: var(--primary-red) !important;
      color: #fff !important;
      font-weight: 600;
    }

    /* Content Area */
    #contentArea {
      flex: 1;
      padding: 0 !important;
      overflow-y: auto;
      background: var(--bg-light) !important;
      color: var(--text-black) !important;
    }

    .page-container {
      padding: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    .inner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 12px 24px;
      border-bottom: 3px solid var(--primary-red);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .inner-header .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .inner-header img {
      height: 40px;
      width: auto;
    }

    .inner-header h2 {
      font-family: 'Georgia', serif;
      font-size: 18px;
      color: var(--primary-red);
      margin: 0;
    }

    /* Navigation & Cards */
    #contentArea .nav-wrap { max-width: 800px; margin: 0 auto; }
    #contentArea h1.page-title { font-family: 'Georgia', serif; font-size: 24px; margin: 0 0 6px; color: var(--primary-red); }
    #contentArea .nav-subtitle { font-size: 13px; color: #555; margin: 0 0 20px; }
    #contentArea .nav-card { background: #ffffff; border-radius: 8px; padding: 20px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); margin-bottom: 16px; border-top: 3px solid var(--primary-red); }
    #contentArea .nav-card label { display: block; font-size: 12px; font-weight: 700; color: var(--text-black); margin-bottom: 5px; margin-top: 12px; text-transform: uppercase; }
    #contentArea .nav-card label:first-child { margin-top: 0; }
    #contentArea .nav-card select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: #fff; font-size: 14px; color: var(--text-black); }
    #contentArea button.primary { width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 6px; background: var(--primary-red); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    #contentArea button.primary:hover { background: var(--dark-red); }

    /* Custom Searchable Dropdown - Exactly Matches Original Select */
    .search-select-box {
      position: relative;
      width: 100%;
    }
    .search-select-box input {
      width: 100%;
      padding: 10px 36px 10px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #fff;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-black);
      outline: none;
      cursor: pointer;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%23333333" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 10px center;
    }
    .search-select-box input:focus {
      border-color: var(--primary-red);
      cursor: text;
    }
    .search-select-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 240px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      z-index: 100;
    }
    .search-select-item {
      padding: 9px 12px;
      font-size: 13.5px;
      color: #222;
      cursor: pointer;
      border-bottom: 1px solid #f2f2f2;
    }
    .search-select-item:last-child {
      border-bottom: none;
    }
    .search-select-item:hover, .search-select-item.selected {
      background-color: #fdf2f2;
      color: var(--primary-red);
      font-weight: 600;
    }

    /* Route Output Steps */
    #contentArea .step { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; align-items: flex-start; }
    #contentArea .step-num { width: 24px; height: 24px; border-radius: 50%; background: #eee; color: var(--text-black); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #contentArea .step-num.stair { background: var(--primary-red); color: #fff; }

    /* Faculty & Gallery */
    .faculty-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
    .faculty-card { background: #fff; border: 1px solid var(--border-color); border-left: 4px solid var(--primary-red); border-radius: 6px; padding: 12px 16px; font-size: 14px; font-weight: 600; color: var(--text-black); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }

    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
    .gallery-img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.15); transition: transform 0.2s; }
    .gallery-img:hover { transform: scale(1.03); }
    #lightboxOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
    #lightboxOverlay img { max-width: 85%; max-height: 80%; border-radius: 8px; border: 3px solid #fff; }
    #lightboxClose { color: #fff; margin-top: 12px; cursor: pointer; font-size: 16px; background: var(--primary-red); padding: 6px 16px; border-radius: 4px; border: none; }
  </style>
</head>

    const nodeMap = {};
    NODES.forEach(n => nodeMap[n.id] = n);
    const adjacency = {};
    NODES.forEach(n => adjacency[n.id] = []);
    EDGES.forEach(([from, to, weight, isStaircase]) => {
      adjacency[from].push({to, weight, isStaircase});
      adjacency[to].push({to: from, weight, isStaircase});
    });

    const directionMap = {};
    EDGES.forEach(([from, to, , , , dir]) => { if (dir) directionMap[from + "|" + to] = dir; });

    function invertDirection(text) {
      return text.replace(/\b(left|right)\b(?!\s+(next to|off|there|beside|away|here))/gi, (m) => {
        const swapped = m.toLowerCase() === "left" ? "right" : "left";
        if (m === m.toUpperCase()) return swapped.toUpperCase();
        if (m[0] === m[0].toUpperCase()) return swapped[0].toUpperCase() + swapped.slice(1);
        return swapped;
      });
    }

    function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

    function getDirection(fromId, toId) {
      if (nodeMap[toId].category === "STAIRCASE" || nodeMap[toId].name.toLowerCase().includes("staircase")) {
        return "Walk to the " + nodeMap[toId].name;
      }

      if (directionMap[fromId + "|" + toId]) return directionMap[fromId + "|" + toId];
      const reverseText = directionMap[toId + "|" + fromId];
      if (!reverseText) return null;
      
      let text = invertDirection(reverseText);
      const destName = nodeMap[toId].name;
      const originName = nodeMap[fromId].name;
      
      if (destName.toLowerCase() !== originName.toLowerCase()) {
        const re = new RegExp("(the\\s+)?" + escapeRegex(destName), "gi");
        text = text.replace(re, (m, thePrefix) => (thePrefix ? thePrefix : "") + originName);
      }
      
      return text;
    }

    function isStaircaseEdge(fromId, toId) {
      const entry = adjacency[fromId].find(e => e.to === toId);
      return entry ? entry.isStaircase : false;
    }

    function dijkstra(startId, endId) {
      const dist = {}, prev = {};
      NODES.forEach(n => dist[n.id] = Infinity);
      dist[startId] = 0;
      const queue = new Set(NODES.map(n => n.id));

      while (queue.size > 0) {
        let current = null, best = Infinity;
        for (const id of queue) { if (dist[id] < best) { best = dist[id]; current = id; } }
        if (current === null) break;
        queue.delete(current);
        if (current === endId) break;

        for (const edge of adjacency[current]) {
          const alt = dist[current] + edge.weight;
          if (alt < dist[edge.to]) { dist[edge.to] = alt; prev[edge.to] = current; queue.add(edge.to); }
        }
      }

      if (dist[endId] === Infinity) return null;
      const path = [];
      let step = endId;
      while (step !== undefined) { path.unshift(nodeMap[step]); step = prev[step]; }
      return { path, distance: dist[endId] };
    }

    function floorLabel(floorNum) {
      if (floorNum === 0) return "Ground Floor";
      if (floorNum === 1) return "1st Floor";
      if (floorNum === 2) return "2nd Floor";
      if (floorNum === 3) return "3rd Floor";
      return `Floor ${floorNum}`;
    }

    function buildSteps(path) {
      if (path.length < 2) return [{ type: "direction", text: "You are already here!" }];
      const legs = [];
      let i = 0;
      while (i < path.length - 1) {
        const stair = isStaircaseEdge(path[i].id, path[i + 1].id);
        let j = i;
        while (j + 1 < path.length - 1 && isStaircaseEdge(path[j + 1].id, path[j + 2].id) === stair) j++;
        legs.push({ type: stair ? "stair" : "walk", start: i, end: j + 1 });
        i = j + 1;
      }

      const steps = [];
      legs.forEach(leg => {
        if (leg.type === "stair") {
          const segStart = path[leg.start], segEnd = path[leg.end];
          const imgUrl = getStaircaseImage(segStart.name);
          steps.push({ 
            type: "staircase", 
            text: "Take the " + segStart.name + " to " + floorLabel(segEnd.floor), 
            staircaseName: segStart.name,
            mergeable: true,
            imageUrl: imgUrl
          });
        } else {
          const from = path[leg.end - 1], to = path[leg.end];
          let dirText = getDirection(from.id, to.id) || ("walk ahead to reach " + to.name);

          if (dirText.toLowerCase().includes("right off the staircase")) {
            dirText = "Walk to the nearby staircase";
          }

          dirText = dirText.charAt(0).toUpperCase() + dirText.slice(1).replace(/\.$/, "") + ".";
          const last = steps[steps.length - 1];
          if (last && last.mergeable) {
            last.text += " — " + dirText.charAt(0).toLowerCase() + dirText.slice(1);
            last.mergeable = false;
          } else {
            steps.push({ type: "direction", text: dirText });
          }
        }
      });
      return steps;
    }

    function setupSearchableSelect(inputId, dropdownId) {
      const input = document.getElementById(inputId);
      const dropdown = document.getElementById(dropdownId);
      if (!input || !dropdown) return;

      const sortedNodes = [...NODES].sort((a, b) => a.name.localeCompare(b.name));

      function renderItems(filterText = "") {
        const q = filterText.trim().toLowerCase();
        const matches = sortedNodes.filter(n => {
          const label = `${n.name} (${floorLabel(n.floor)})`.toLowerCase();
          return label.includes(q);
        });

        if (matches.length === 0) {
          dropdown.innerHTML = `<div style="padding:10px 12px; font-size:13px; color:#888;">No matching locations found</div>`;
          return;
        }

        dropdown.innerHTML = matches.map(n => `
          <div class="search-select-item" data-id="${n.id}" data-label="${n.name} (${floorLabel(n.floor)})">
            ${n.name} <span style="font-size:11.5px; color:#666;">(${floorLabel(n.floor)})</span>
          </div>
        `).join('');

        dropdown.querySelectorAll('.search-select-item').forEach(item => {
          item.addEventListener('mousedown', (e) => {
            e.preventDefault();
            input.value = item.getAttribute('data-label');
            input.setAttribute('data-id', item.getAttribute('data-id'));
            input.readOnly = true;
            dropdown.style.display = 'none';
          });
        });
      }

      renderItems();

      input.addEventListener('click', () => {
        input.readOnly = false;
        document.querySelectorAll('.search-select-dropdown').forEach(d => {
          if (d !== dropdown) d.style.display = 'none';
        });
        dropdown.style.display = 'block';
        renderItems(input.value);
        input.select();
      });

      input.addEventListener('input', () => {
        dropdown.style.display = 'block';
        renderItems(input.value);
      });

      input.addEventListener('blur', () => {
        setTimeout(() => {
          dropdown.style.display = 'none';
          input.readOnly = true;
          const currentId = input.getAttribute('data-id');
          if (currentId && nodeMap[currentId]) {
            input.value = `${nodeMap[currentId].name} (${floorLabel(nodeMap[currentId].floor)})`;
          } else {
            const found = sortedNodes.find(n => `${n.name} (${floorLabel(n.floor)})`.toLowerCase() === input.value.trim().toLowerCase());
            if (found) {
              input.setAttribute('data-id', found.id);
              input.value = `${found.name} (${floorLabel(found.floor)})`;
            }
          }
        }, 180);
      });
    }

    function swapLocations() {
      const fromInput = document.getElementById("fromInput");

      if (fromInput && toInput) {
        const tempVal = fromInput.value;
        const tempId = fromInput.getAttribute('data-id');

        fromInput.value = toInput.value;
        fromInput.setAttribute('data-id', toInput.getAttribute('data-id') || '');

        toInput.value = tempVal;
        toInput.setAttribute('data-id', tempId || '');
      }
    }

    function findRoute() {
      const startId = document.getElementById("fromInput").getAttribute("data-id");
      const endId = document.getElementById("toInput").getAttribute("data-id");
      const statusDiv = document.getElementById("status");
      const resultCard = document.getElementById("resultCard");
      const resultHeader = document.getElementById("resultHeader");
      const stepsDiv = document.getElementById("steps");
      const destPreviewDiv = document.getElementById("destinationPreview");
      
      if (!startId || !endId) {
        statusDiv.innerHTML = '<p style="color:red; font-size:13px; margin-top:8px;">Please select both a starting point and a destination from the list.</p>';

      if (startId === endId) {
        statusDiv.innerHTML = '<p style="color:var(--primary-red); font-size:13px; margin-top:8px;">You are already at your destination!</p>';

      if (!result) {

              ${s.imageUrl ? `
                <div style="margin-top:8px;">
                  <img src="${s.imageUrl}" alt="Staircase preview" style="width:100%; max-width:280px; height:150px; object-fit:cover; border-radius:6px; border:1px solid #ddd; box-shadow:0 2px 6px rgba(0,0,0,0.1); cursor:pointer;" onclick="openLightbox('${s.imageUrl}')">
                  <div style="font-size:12px; font-weight:600; color:var(--primary-red); margin-top:4px;">${s.staircaseName || 'Staircase'}</div>
                  <div style="font-size:11px; color:#666; margin-top:1px;">(Click photo to enlarge)</div>
                </div>
              ` : ''}
            </div>
          </div>
        `).join('');
      }

      /* Destination photo preview (only for Bonnet Lab, MMR, SCAVI) */
      if (destPreviewDiv) {
        if (DESTINATION_IMAGES[endId]) {
          const destImg = DESTINATION_IMAGES[endId];
          const destName = nodeMap[endId].name;
          destPreviewDiv.innerHTML = `
            <div style="font-size:13px; font-weight:700; color:var(--primary-red); margin-bottom:8px;">Destination Preview: ${destName}</div>
            <img src="${destImg}" alt="${destName}" style="width:100%; max-width:320px; height:180px; object-fit:cover; border-radius:6px; border:1px solid #ddd; box-shadow:0 2px 6px rgba(0,0,0,0.12); cursor:pointer;" onclick="openLightbox('${destImg}')">
            <div style="font-size:11px; color:#666; margin-top:3px;">(Click photo to enlarge)</div>
          `;
          destPreviewDiv.style.display = 'block';
        } else {
          destPreviewDiv.style.display = 'none';
          destPreviewDiv.innerHTML = '';
        }
      }
      
      if (resultCard) resultCard.style.display = 'block';
    }

    function showDepartments() {
      setActiveButton('btnDepartments');
      contentArea.innerHTML = getHeaderHTML() + `
        <div class="page-container">
          <div class="nav-wrap">
            <h1 class="page-title">Academic Departments</h1>
            <p class="nav-subtitle">Select a faculty stream and department to view the teaching staff.</p>
            <div class="nav-card">
              <label for="streamSelect">Select Stream</label>
              <select id="streamSelect" onchange="onStreamChange()">
                <option value="">-- Choose Stream --</option>
                <option value="ARTS">Arts</option>
                <option value="SCIENCE">Science</option>
                <option value="COMMERCE">Commerce</option>
              </select>
              
              <label for="deptSelect">Select Department</label>
              <select id="deptSelect" onchange="onDeptChange()" disabled>
                <option value="">-- Choose Department --</option>
              </select>
            </div>
            <div id="facultyDisplay"></div>
          </div>
        </div>
      `;
    }

    function onStreamChange() {
      const stream = document.getElementById("streamSelect").value;
      const deptSelect = document.getElementById("deptSelect");
      const facultyDisplay = document.getElementById("facultyDisplay");
      
      deptSelect.innerHTML = '<option value="">-- Choose Department --</option>';
      facultyDisplay.innerHTML = '';
      
      if (!stream) {
        deptSelect.disabled = true;
        return;
      }
      
      deptSelect.disabled = false;
      Object.keys(FACULTY_DATA[stream]).forEach(dept => {
        const opt = document.createElement("option");
        opt.value = dept;
        opt.textContent = dept;
        deptSelect.appendChild(opt);
      });
    }

    function onDeptChange() {
      const stream = document.getElementById("streamSelect").value;
      const dept = document.getElementById("deptSelect").value;
      const facultyDisplay = document.getElementById("facultyDisplay");
      
      if (!stream || !dept) {
        facultyDisplay.innerHTML = '';
        return;
      }
      
      const facultyList = FACULTY_DATA[stream][dept];
      let cardsHTML = facultyList.map(name => `<div class="faculty-card">${name}</div>`).join('');
      
      facultyDisplay.innerHTML = `
        <div class="nav-card">
          <h3 style="margin:0 0 12px; color:var(--primary-red); font-family:'Georgia', serif;">${dept} Faculty</h3>
          <div class="faculty-grid">${cardsHTML}</div>
        </div>
      `;
    }
